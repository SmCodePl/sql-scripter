[package]
name = "sql-scripter"
description = "SQL Scripter - scripts MSSQL schema changes to disk"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "sql_scripter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scripter-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Encryption key for stored passwords lives in the OS credential store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
